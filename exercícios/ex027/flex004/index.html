<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexible Box</title>
    <style>
        div.conteiner{
            background-color: lightsalmon;
            height: 300px;
            display: flex;
            flex-flow: row nowrap;
            justify-content: space-around;
            align-items: center;
        }

        div.item {
            background-color: lightblue;
            border:1px solid black;
            text-align: center;

            
        }
    </style>
</head>
<body>
    <div class="conteiner"> <!--Pai-->
        <div class="item">A</div> <!--Filha-->
        <div class="item">B</div> <!--Filha-->
        <div class="item">C</div> <!--Filha-->
        <div class="item">D</div> <!--Filha-->
        <div class="item">E</div> <!--Filha-->
        <div class="item">F</div> <!--Filha-->
        <div class="item">G</div> <!--Filha-->
        
    </div>
</body>
</html>
