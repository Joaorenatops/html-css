<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexible Box</title>
    <style>
        div.conteiner{
            background-color: lightsalmon;

            display: flex;
            flex-flow: row wrap-reverse;
        }

        div.item {
            background-color: lightblue;
            border:1px solid black;
            text-align: center;
            flex: auto;

            
        }
    </style>
</head>
<body>
    <div class="conteiner"> <!--Pai-->
        <div class="item">Exemplo de bloco-A</div> <!--Filha-->
        <div class="item">Exemplo de bloco-B</div> <!--Filha-->
        <div class="item">Exemplo de bloco-C</div> <!--Filha-->
        <div class="item">Exemplo de bloco-D</div> <!--Filha-->
        <div class="item">Exemplo de bloco-E</div> <!--Filha-->
        <div class="item">Exemplo de bloco-F</div> <!--Filha-->
        <div class="item">Exemplo de bloco-G</div> <!--Filha-->
        
    </div>
</body>
</html>
