<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexible Box</title>
    <style>
        div.conteiner{
            background-color: lightsalmon;

            display: flex;
            flex-flow: row nowrap;
        }

        div.item {
            background-color: lightblue;
            border:1px solid black;
            text-align: center;
            flex-basis: 300px;
            flex-shrink: 1;
            flex-grow: 1;
            
        }
    </style>
</head>
<body>
    <div class="conteiner"> <!--Pai-->
        <div class="item">A</div> <!--Filha-->
        <div class="item">B</div> <!--Filha-->
        <div class="item">C</div> <!--Filha-->
    </div>
</body>
</html>
