<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexible Box</title>
    <style>
        div.conteiner{
            background-color: lightsalmon;

            display: flex;
            flex-flow: row wrap;
        }

        div.item {
            background-color: lightblue;
            border:1px solid black;
            text-align: center;
            padding: 20px;

            
        }

        div#l1 {
            order: 0;
        }

        div#l2 {
            order: 0;
        }
        
        div#l3 {
            order: -2;
        }

        div#l4 {
            order: 4;
        }

        div#l5 {
            order: 8;
        }

        div#l6 {
            order: 0;
        }

        div#l7 {
            order: 2;
        }
    </style>
</head>
<body>
    <div class="conteiner"> <!--Pai-->
        <div class="item" id="l1">A</div> <!--Filha-->
        <div class="item" id="l2">B</div> <!--Filha-->
        <div class="item" id="l3">C</div> <!--Filha-->
        <div class="item" id="l4">D</div> <!--Filha-->
        <div class="item" id="l5">E</div> <!--Filha-->
        <div class="item" id="l6">F</div> <!--Filha-->
        <div class="item" id="l7">G</div> <!--Filha-->
        
    </div>
</body>
</html>
