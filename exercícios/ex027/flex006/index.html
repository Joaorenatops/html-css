<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexible Box</title>
    <style>
        div.conteiner{
            background-color: lightsalmon;

            display: flex;
            flex-flow: row wrap;
            align-content: flex-start;
            height: 400px;
        }

        div.item {
            background-color: lightblue;
            border:1px solid black;
            text-align: center;
            padding: 40px;
            
        }
    </style>
</head>
<body>
    <div class="conteiner"> <!--Pai-->
        <div class="item">A</div> <!--Filha-->
        <div class="item">B</div> <!--Filha-->
        <div class="item">C</div> <!--Filha-->
        <div class="item">D</div> <!--Filha-->
        <div class="item">E</div> <!--Filha-->
        <div class="item">F</div> <!--Filha-->
        <div class="item">G</div> <!--Filha-->
        <div class="item">H</div> <!--Filha-->
        <div class="item">I</div> <!--Filha-->
        <div class="item">J</div> <!--Filha-->
        <div class="item">K</div> <!--Filha-->
        <div class="item">L</div> <!--Filha-->
        <div class="item">M</div> <!--Filha-->
        
        
    </div>
</body>
</html>
